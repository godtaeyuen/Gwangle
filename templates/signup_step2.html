<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 - 광글</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-right">
        <button class="top-btn" onclick="history.back()">이전으로</button>
        <button class="top-btn" onclick="location.href='/'">메인으로</button>
      </div>
    </header>

    <main class="main auth-main">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-wrap auth-flash-wrap">
            {% for message in messages %}
              <div class="flash-message">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <h1 class="logo-text auth-logo">
        <span class="logo-blue">G</span><span class="logo-red">w</span><span class="logo-yellow">a</span><span class="logo-blue">n</span><span class="logo-green">g</span><span class="logo-red">l</span><span class="logo-yellow">e</span>
      </h1>

      <div class="auth-card">
        <div class="step-badge">2 / 2 단계</div>
        <h2 class="auth-title">학교 정보 입력</h2>
        <p class="auth-desc">학번, 이름, 담임선생님을 입력해주세요.</p>

        <form class="auth-form" method="POST" action="/signup/step2">
          <input type="text" class="auth-input" name="studentId" placeholder="학번">
          <input type="text" class="auth-input" name="studentName" placeholder="이름">

          <select class="auth-input" name="homeroomTeacherId">
            <option value="">담임선생님 선택</option>
            {% for teacher in teachers %}
              <option value="{{ teacher.id }}">{{ teacher.title }} / {{ teacher.desc }}</option>
            {% endfor %}
          </select>

          <button type="submit" class="auth-submit-btn">회원가입 완료</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>

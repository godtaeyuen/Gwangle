<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광글 로그인</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    body {
      background: #ffffff;
    }

    .auth-main {
      max-width: 520px;
      margin: 0 auto;
      padding: 48px 18px;
    }

    .auth-card {
      border: 1px solid #dadce0;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 2px 14px rgba(60, 64, 67, 0.1);
      background: #ffffff;
    }

    .auth-title {
      margin: 0 0 8px;
      font-size: 30px;
      color: #202124;
    }

    .auth-desc {
      margin: 0 0 22px;
      color: #5f6368;
      font-size: 14px;
      line-height: 1.6;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .role-tab {
      border: 1px solid #dadce0;
      border-radius: 999px;
      background: #ffffff;
      color: #3c4043;
      padding: 10px 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .role-tab.active {
      background: #1a73e8;
      color: #ffffff;
      border-color: #1a73e8;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-label {
      font-size: 13px;
      font-weight: 700;
      color: #3c4043;
    }

    .auth-input {
      width: 100%;
      height: 48px;
      border: 1px solid #dadce0;
      border-radius: 16px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }

    .auth-input:focus {
      border-color: #1a73e8;
    }

    .auth-btn {
      height: 50px;
      border: none;
      border-radius: 999px;
      background: #1a73e8;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    .auth-btn:hover {
      background: #1765cc;
    }

    .auth-links {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }

    .auth-links a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: 700;
    }

    .flash-wrap {
      margin-bottom: 14px;
    }

    .flash-message {
      padding: 12px 14px;
      border-radius: 16px;
      background: #fce8e6;
      color: #c5221f;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .role-help {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #f8fafd;
      border: 1px solid #eceff1;
      color: #5f6368;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-right">
        <button class="top-btn" onclick="location.href='/'">메인으로</button>
        <button class="top-btn" onclick="location.href='/signup'">회원가입</button>
      </div>
    </header>

    <main class="auth-main">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-wrap">
            {% for message in messages %}
              <div class="flash-message">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <section class="auth-card">
        <h1 class="auth-title">로그인</h1>
        <p class="auth-desc">
          학생, 선생님, 관리자 유형을 선택한 뒤 로그인하세요.
        </p>

        <div class="role-tabs">
          <button type="button" class="role-tab active" data-role="student">학생</button>
          <button type="button" class="role-tab" data-role="teacher">선생님</button>
          <button type="button" class="role-tab" data-role="admin">관리자</button>
        </div>

        <p id="roleHelp" class="role-help">
          학생 계정은 학번 기반 시간표, 프로필, 대입 상담 기능을 사용할 수 있습니다.
        </p>

        <form class="auth-form" method="POST" action="/login">
          <input type="hidden" id="loginRole" name="loginRole" value="student">

          <label class="auth-label" for="username">아이디</label>
          <input id="username" name="username" class="auth-input" type="text" placeholder="아이디 입력" autocomplete="username">

          <label class="auth-label" for="password">비밀번호</label>
          <input id="password" name="password" class="auth-input" type="password" placeholder="비밀번호 입력" autocomplete="current-password">

          <button id="loginBtn" class="auth-btn" type="submit">학생 로그인</button>
        </form>

        <div class="auth-links">
          <a href="/">메인으로</a>
          <a href="/signup">회원가입</a>
        </div>
      </section>
    </main>
  </div>

  <script>
    const tabs = document.querySelectorAll(".role-tab");
    const loginRole = document.getElementById("loginRole");
    const roleHelp = document.getElementById("roleHelp");
    const loginBtn = document.getElementById("loginBtn");

    const roleInfo = {
      student: {
        help: "학생 계정은 학번 기반 시간표, 프로필, 대입 상담 기능을 사용할 수 있습니다.",
        button: "학생 로그인"
      },
      teacher: {
        help: "선생님 계정은 교사용 기능 확장을 위한 계정입니다. 현재는 기본 로그인만 지원합니다.",
        button: "선생님 로그인"
      },
      admin: {
        help: "관리자 계정은 광글 운영 페이지 접속용입니다. 관리자 기능은 차차 구현됩니다.",
        button: "관리자 로그인"
      }
    };

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const role = tab.dataset.role;

        tabs.forEach(item => item.classList.remove("active"));
        tab.classList.add("active");

        loginRole.value = role;
        roleHelp.textContent = roleInfo[role].help;
        loginBtn.textContent = roleInfo[role].button;
      });
    });
  </script>
</body>
</html>

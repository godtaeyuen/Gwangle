<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 - 광글</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-right">
        <button class="top-btn" onclick="location.href='/'">메인으로</button>
      </div>
    </header>

    <main class="main auth-main">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-wrap auth-flash-wrap">
            {% for message in messages %}
              <div class="flash-message">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <h1 class="logo-text auth-logo">
        <span class="logo-blue">G</span><span class="logo-red">w</span><span class="logo-yellow">a</span><span class="logo-blue">n</span><span class="logo-green">g</span><span class="logo-red">l</span><span class="logo-yellow">e</span>
      </h1>

      <div class="auth-card">
        <div class="step-badge">1 / 2 단계</div>
        <h2 class="auth-title">개인정보 입력</h2>
        <p class="auth-desc">아이디와 비밀번호를 입력해주세요.</p>

        <form class="auth-form" method="POST" action="/signup">
          <input type="text" class="auth-input" name="username" placeholder="아이디">
          <input type="password" class="auth-input" name="password" placeholder="비밀번호">
          <input type="password" class="auth-input" name="passwordConfirm" placeholder="비밀번호 확인">

          <button type="submit" class="auth-submit-btn">다음으로</button>
        </form>

        <div class="auth-footer-text">
          이미 계정이 있나요?
          <a href="/login">로그인</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
